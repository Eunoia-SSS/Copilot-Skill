[package]
name = "matchlink"
version = "0.1.0"
description = "Atomic token donations with sponsor matching"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "matchlink"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["associated_token", "token"] }
